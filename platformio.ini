; Build setup for tef668x-esp32.
;
; One environment per board, plus a native environment that builds and tests
; the core layer on this machine with no radio attached.
;
; Versions are pinned exactly, never as a range, so a build here and a build in
; CI compile the same code. Check for newer releases when a phase starts.

[platformio]
default_envs = ats125
src_dir = src
test_dir = test

[env]
; Only our own sources get the strict warnings. The framework headers trip
; -Wshadow in their own code and there is nothing useful to do about that.
build_flags =
  -I src
build_src_flags =
  -Wall
  -Wextra
  -Wshadow

; ---------------------------------------------------------------------------
; ATS-125. ESP32-D0WD-V3 in a WROOM-32U class module, 8MB flash, no PSRAM.
; ---------------------------------------------------------------------------
[env:ats125]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728

; The FT232R on this board is not wired for auto reset, so a serial upload
; needs someone to hold BOOT and tap RESET. Everything after the first flash
; goes over the air.
upload_port = /dev/cu.usbserial-A5069RR4
upload_speed = 460800
extra_scripts = pre:tools/pio_upload_port.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  ${env.build_flags}
  -DBOARD_ATS125=1
  -DCORE_DEBUG_LEVEL=1
build_src_flags = ${env.build_src_flags}

; ---------------------------------------------------------------------------
; The core layer on this machine. No hardware, no framework.
; ---------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
  ${env.build_flags}
  ${env.build_src_flags}
  -O0
  -g
  --coverage
extra_scripts = post:tools/pio_native_coverage.py
build_type = debug
