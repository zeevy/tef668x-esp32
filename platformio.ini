; Build setup for tef668x-esp32.
;
; One environment per board, plus a native environment that builds and tests
; the core layer on this machine with no radio attached.
;
; Versions are pinned exactly, never as a range, so a build here and a build in
; CI compile the same code. Check for newer releases from time to time.

[platformio]
default_envs = ats125

[env]
; Only our own sources get the strict warnings. The framework headers trip
; -Wshadow in their own code and there is nothing useful to do about that.
build_flags =
  -I src
build_src_flags =
  -Wall
  -Wextra
  -Wshadow

; ---------------------------------------------------------------------------
; ATS-125. ESP32-D0WD-V3 in a WROOM-32U class module, 8MB flash, no PSRAM.
; ---------------------------------------------------------------------------
[env:ats125]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728

; The framework's ESP-IDF libraries rebuilt with one change: mbedTLS keeps
; 4 KB for what it sends where it kept 16 KB, about 12 KB less heap for
; every HTTPS connection. Received records can still be 16 KB, since a
; server is free to send them that size. The other lines put back the
; values the shipped libraries were built with for this board's DIO flash,
; which the board's own values would otherwise replace in the rebuild; a
; line that unsets a choice is quoted, or it would read as a comment.
; tools/pin_components.py keeps the components the rebuild fetches at the
; shipped versions.
custom_sdkconfig =
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_SPEED_80M=y
  '# CONFIG_SPIRAM_SPEED_40M is not set'
  CONFIG_SPIRAM_SPEED=80
  CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
  '# CONFIG_ESPTOOLPY_FLASHFREQ_40M is not set'
  CONFIG_ESPTOOLPY_FLASHFREQ="80m"
  CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  '# CONFIG_ESPTOOLPY_FLASHSIZE_8MB is not set'
  CONFIG_ESPTOOLPY_FLASHSIZE="4MB"
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_160=y
  '# CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240 is not set'
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=160
  CONFIG_ESP32_DEFAULT_CPU_FREQ_160=y
  '# CONFIG_ESP32_DEFAULT_CPU_FREQ_240 is not set'

; The FT232R on this board is not wired for auto reset, so a serial upload
; needs someone to hold BOOT and tap RESET. Everything after the first flash
; goes over the air. PlatformIO finds the serial port by itself; with more
; than one adapter plugged in, name it with --upload-port.
upload_speed = 460800
extra_scripts =
  pre:tools/pin_components.py
  pre:tools/patch_webserver.py
  pre:tools/pio_build_id.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Pinned exactly, never a range, so every build gets the same library. LVGL
; is configured from src/ui/lv_conf.h rather than the library's own copy,
; which is what LV_CONF_PATH selects.
lib_deps =
  lvgl/lvgl@9.5.0

; ArduinoOTA is off, FEATURE_OTA 0 in src/board/board_ats125.h. The
; library finder builds a library it sees included even behind #if, and its
; global object would then be linked, so it is left out here too. Turning
; FEATURE_OTA back on means taking this line out.
lib_ignore = ArduinoOTA

build_flags =
  ${env.build_flags}
  -DBOARD_ATS125=1
  -DCORE_DEBUG_LEVEL=1
  ; The inner quotes are part of the macro value, so the outer single quotes
  ; are what stops the ini and the shell eating them.
  -DLV_CONF_PATH='"${platformio.src_dir}/ui/lv_conf.h"'

; The analysis runs without the framework's headers, so cppcheck does not
; know PROGMEM, which only places a table in flash, and stops at the first
; one it meets.
check_flags = cppcheck: -DPROGMEM=

; ---------------------------------------------------------------------------
; The core layer on this machine. No hardware, no framework.
; ---------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = yes
build_src_filter = +<core/> +<screen_state.cpp> +<screen_dx_state.cpp> +<screen_rds_state.cpp> +<screen_bw_state.cpp> +<drivers/tef668x_decode.c> +<reply_times.cpp>
build_flags =
  ${env.build_flags}
  ${env.build_src_flags}
  -O0
  -g
  --coverage
extra_scripts = post:tools/pio_native_coverage.py
build_type = debug
