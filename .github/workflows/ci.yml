# Gates for every push and every pull request.
#
# This runs tools/check.sh, the same script that runs on a development machine.
# Seven of the eight gates give the same answer in both places. Coverage does not:
# llvm-cov on macOS and gcov on Linux count lines differently, so this run is
# the number that counts.
#
# What this cannot do: the display, the tuner over I2C, touch and audio need a
# radio. Those are checked by hand on a radio.
#
# Every action is pinned to the full commit SHA of its release, with the
# version in a comment beside it. A tag can be moved to other code, a SHA
# cannot. Dependabot opens a pull request when a new release comes out, and
# updates the SHA and the comment together.

name: checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read only. Nothing here writes: size-comment.yml posts the size comment.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
# Runs on master are never cancelled, so every merge gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: build, test and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The web page is built with Node and its browser tests run in Chromium.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web page's tools and its test browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The framework's libraries are rebuilt for custom_sdkconfig into
      # ~/.platformio/packages, and sdkconfig.defaults holds the hash the
      # platform compares to decide whether they need rebuilding again, so
      # the two are kept together. A change to either input file rebuilds.
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            sdkconfig.defaults
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'tools/pin_components.py') }}
          restore-keys: pio-${{ runner.os }}-

      # Pinned exactly, never a range. clang-format in particular: Ubuntu ships
      # 18 and macOS ships 21, and a formatter that disagrees between the two
      # makes the format gate useless.
      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0 gcovr==8.6 clang-format==23.1.1 esp-idf-size==2.3.2

      - name: Run every gate
        run: tools/check.sh

      # The browser tests' traces, kept only for a test that failed, so a
      # failure here can be replayed with npx playwright show-trace.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-traces
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

      # The size of the image the build gate just made, for the comment that
      # size-comment.yml posts on the pull request from a run of its own. It
      # runs when another gate failed too, since the size is still worth
      # seeing then.
      #
      # esp-idf-size reads the link map. Its DRAM figure is the static part,
      # .data and .bss, out of the 124,580 bytes the linker has for it. That is
      # the limit that matters, and the PlatformIO summary does not show it.
      - name: Measure the image
        id: measure
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python -m esp_idf_size --format json2 .pio/build/ats125/firmware.map > size.json
          python -m esp_idf_size .pio/build/ats125/firmware.map

      - if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: size.json
          retention-days: 1
