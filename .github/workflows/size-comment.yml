# Posts the size of a pull request's image as one comment on it, and updates
# that comment on every push.
#
# This runs apart from the checks on purpose. A pull request from a fork gets a
# read only token in the checks, so a comment cannot be posted from there.
# workflow_run runs this file as it is on master, with its own token, once the
# checks finish. It never checks out the pull request and runs none of its
# code. The file it reads was written by the pull request's build, so it takes
# only whole numbers from it, and a pull request cannot put text of its own
# into the comment.
#
# Actions are pinned by SHA, as in ci.yml.

name: size comment

on:
  # Safe here for the reasons at the top: no checkout, only numbers read.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [checks]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: post the size
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read
      pull-requests: write

    steps:
      # No files means the image did not build. The checks already say so.
      - id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: size-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // One application slot in partitions.csv. That table never
            // changes, because a change would need a cable on every radio.
            const SLOT = 3145728;

            // Whole numbers of bytes only. Anything else reads as missing.
            const bytes = v => (Number.isSafeInteger(v) && v >= 0 ? v : null);

            function read(file) {
              const out = { image: { used: null, total: SLOT } };
              let doc;
              try {
                doc = JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch {
                return out;
              }
              out.image.used = bytes(doc.total_size);
              const wanted = ['DRAM', 'IRAM'];
              for (const m of Array.isArray(doc.layout) ? doc.layout : []) {
                if (m && wanted.includes(m.name)) {
                  out[m.name] = { used: bytes(m.used), total: bytes(m.total) };
                }
              }
              return out;
            }

            const size = read('size.json');
            // The same bar as the PlatformIO summary, ten steps wide.
            const lines = [
              ['DRAM:', 'DRAM'],
              ['IRAM:', 'IRAM'],
              ['Flash:', 'image'],
            ].map(([label, key]) => {
              const m = size[key] || { used: null, total: null };
              const name = label.padEnd(7);
              if (m.used === null || !m.total) {
                return `${name}?`;
              }
              const pct = (100 * m.used) / m.total;
              const bar = '='.repeat(Math.min(10, Math.floor(pct / 10))).padEnd(10);
              return `${name}[${bar}] ${pct.toFixed(1).padStart(5)}% ` +
                `(used ${m.used} bytes from ${m.total} bytes)`;
            });

            const marker = '<!-- size-report -->';
            const body = [
              marker,
              '### Size on `ats125`',
              '',
              '```',
              ...lines,
              '```',
              '',
              'DRAM is the static part, taken before the radio starts. Every ' +
                'byte added there is a byte less for the heap. One application ' +
                'slot is 3 MB. The other slot holds the image this one replaces.',
            ].join('\n');

            // A pull request from this repository is named in the event. One
            // from a fork is not, so it is found by its branch and commit.
            let number = (run.pull_requests || [])[0]?.number;
            if (!number) {
              const { data } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              });
              number = data.find(p => p.head.sha === run.head_sha)?.number;
            }
            if (!number) {
              core.info('No open pull request for this run.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const mine = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
